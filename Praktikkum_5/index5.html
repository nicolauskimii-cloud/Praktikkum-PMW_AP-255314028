<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Saya — Modul 3</title>
  <link rel="stylesheet" href="style5.css">
</head>
<body>
  <header>
    <h1>Blog Belajar Web</h1>
    <nav>
      <button id="btn-tema">Mode Gelap</button>
      <button id="btn-info">Info Tambahan</button>
    </nav>
  </header>

  <main>
    <!-- Artikel dirender secara dinamis oleh script.js (Langkah 4) -->
    <section class="daftar-artikel"></section>

    <aside>
      <h2>Info Tambahan</h2>
      <p>Klik tombol "Info Tambahan" untuk menampilkan atau menyembunyikan kotak ini.</p>
    </aside>
  </main>

  <!-- Langkah 3 Form Komentar Praktikum  5-->
  <section id="komentar">
    <h2>Komentar</h2>
    <form id="form-komentar">
      <label for="nama">Nama:</label>
      <input type="text" id="nama" name="nama" required>

      <label for="komentar">Komentar:</label>
      <textarea id="komentar" name="komentar" required></textarea>

      <button type="submit">Kirim</button>
    </form>
    <div id="daftar-komentar"></div>
  </section>

  <footer>
    <p>&copy; 2026 Blog Belajar Web.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
