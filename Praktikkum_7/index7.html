<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil & Blog — Nicolaus Kimi Haryoyudo</title>
  <link rel="stylesheet" href="style5.css">
</head>
<body>
  <header>
    <h1>Blog Belajar Web Nicolaus Kimi Haryoyudo</h1>
    <nav>
      <button id="btn-tema">Mode Gelap</button>
      <button id="btn-info">Info Tambahan</button>
    </nav>
  </header>

  <main>

      <!-- Bagian Profil (Digabung langsung dari ProfileSaya.html) -->
    <section id="profil-saya" style="margin-bottom: 2rem;">
      <img src="https://arsip.usd.ac.id/foto/fotomhs/2025/255314028.jpg" width="85" alt="Foto Profil">
    </section>

    <!-- Artikel dirender secara dinamis oleh script.js -->
    <section class="daftar-artikel"></section>

    <aside>
      <h2>Info Tambahan</h2>
      <p>Klik tombol "Info Tambahan" untuk menampilkan atau menyembunyikan kotak ini.</p>
    </aside>
  </main>

  <!-- Form Komentar Praktikum -->
  <section id="komentar">
    <h2>Tinggalkan Komentar</h2>
    <form id="form-komentar">
      <input type="text" id="input-nama" placeholder="Nama Anda" 
       required minlength="5" maxlength="30">

      <textarea id="input-pesan" placeholder="Tulis komentar..." name="komentar" required></textarea>

      <button type="submit">Kirim</button>
    </form>
    <ul id="daftar-komentar"></ul>
  </section>

  <!-- Form pendaftaran akun (Modul 5) -->
   <section id="pendaftaran">
    <h2>Pendaftaran Akun</h2>
    <form id="form-daftar">
      <input type="text" id="username" placeholder="username" required minlength="4">
      <span class="pesan-error" id="error-username"></span>

      <input type="email" id="email" placeholder="email" required>
      <span class="pesan-error" id="error-email"></span>

      <input type="password" id="password" placeholder="password" required minlength="8">
      <span class="pesan-error" id="error-password"></span>

      <input type="password" id="konfirmasi" placeholder="konfirmasi password" required>
      <span class="pesan-error" id="error-konfirmasi"></span>

      <button type="submit">Daftar</button>
    </form>
   </section>
   
  <footer>
    <button id="btn-reset">Reset Semua</button>
    <p>&copy; 2026 Nicolaus Kimi Haryoyudo — Blog Belajar Web.</p>
    <a href="https://www.instagram.com/nicholas_kimii/" target="_blank">Akun Instagram</a>
  </footer>

  <script src="script7.js"></script>
</body>
</html>
