<html>
    <head>
        <title>Belajar Javascript</title>
    </head>
    <from>
        <label for="bilangan">Bilangan 1 :</label>
        <input type="text" id="bilangan1" placeholder="Masukkan Bilangan 1">
        <label for="bilangan">Bilangan 2 :</label>
        <input type="text" id="bilangan2" placeholder="Masukkan Bilangan 2">
        <button onclick="tambah()">+</button>
        <button onclick="kurang()">-</button>
        <div id="hasil"></div>
        <script>
            function tambah(){
                var bilangan1 = parseFloat(document.getElementById("bilangan1").value);
                var bilangan2 = parseFloat(document.getElementById("bilangan2").value);
                var hasil = bilangan1 + bilangan2;
                document.getElementById("hasil").innerHTML = "Hasil Penjumlahan : " + hasil;
            }
            function kurang(){
                var bilangan1 = parseFloat(document.getElementById("bilangan1").value);
                var bilangan2 = parseFloat(document.getElementById("bilangan2").value);
                var hasil = bilangan1 - bilangan2;
                document.getElementById("hasil").innerHTML = "Hasil Pengurangan : " + hasil;
            }
            
        </script>
    </from>
</html>
